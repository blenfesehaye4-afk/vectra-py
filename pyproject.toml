[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectra-py"
version = "0.3.0"
description = "Lightweight, embeddable vector search engine & hybrid retrieval store for Python AI applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Blen Fesehaye", email = "blenfesehaye4@gmail.com" }
]
keywords = [
    "vector-database",
    "hnsw",
    "hybrid-search",
    "bm25",
    "product-quantization",
    "scalar-quantization",
    "embeddings",
    "similarity-search",
    "semantic-search",
    "ai",
    "llm-memory",
    "cosine-similarity",
    "information-retrieval"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]
cli = [
    "rich>=13.0.0",
]

[project.scripts]
vectra = "vectra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vectra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
